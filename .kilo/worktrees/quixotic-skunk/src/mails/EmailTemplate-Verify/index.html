<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verification</title>
    <style>
      :root {
        --primary-color: #b0001d;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        line-height: 30px;
      }

      header {
        height: 116px;
        background-image: url('./images/Mask-group.svg'),
          linear-gradient(
            94deg,
            rgba(145, 2, 26, 1) 16%,
            rgba(176, 0, 29, 1) 99%
          );
        background-repeat: repeat-x;
      }
      .left-image {
        margin: 41px 0 41px 30px;
      }
      .left-image > img {
        margin-top: 41px;
      }

      .right-image {
        margin: 5px 30px 41px 0;
      }
      .right-image > img {
        float: right;
      }

      main {
        min-height: 50vh;
        padding: 6%;
      }
      main > section {
        margin-bottom: 20px;
        max-width: 80%;
      }
      main > section > ul {
        list-style-type: none;
        padding-left: 20px;
        line-height: 22px;
      }
      .codes {
        font-size: 25px;
        letter-spacing: 15px;
      }
      footer {
        text-align: center;
      }
      footer > div {
        margin-bottom: 10px;
      }

      .socails > a {
        margin-right: 15px;
        text-decoration: none;
      }

      .tribeCare {
        line-height: 18px;
        margin-bottom: 20px;
      }

      .regards {
        margin-top: 80px;
      }

      @media screen and (max-width: 760px) {
        main > section {
          max-width: 100%;
        }
        .left-image > img {
          width: 40%;
          margin-top: 20px;
        }

        .right-image > img {
          width: 90%;
        }

        .left-image {
          margin: 25px 0 20px 15px;
        }

        .right-image {
          margin: 3px 15px 20px 0;
        }

        header {
          height: 80px;
        }
      }
    </style>
  </head>
  <body style="margin: 0 10% 0 10%">
    <main style="min-height: 50vh; padding: 6%">
      <section style="margin-bottom: 20px; max-width: 80%; margin-top: 30px">
        <p>Hello, %name%</p>
      </section>
      <section><p>Your verification code is.</p></section>
      <br />
      <section style="margin-bottom: 20px; max-width: 80%">
        <p class="codes" style="color: #bc0221"><b> %code%</b></p>
      </section>

    </main>
    <footer>
      <div>
      </div>
    </footer>
  </body>
</html>
